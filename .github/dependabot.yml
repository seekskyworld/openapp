version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /backend
      - /backend/runtime
      - /frontend
      - /packages/contracts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /backend/deployment/bundle
      - /examples/plain-web/runtime
    schedule:
      interval: weekly
